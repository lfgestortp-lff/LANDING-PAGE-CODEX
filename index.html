edia(prefers-reduced-motion:reduce){form,.fill{animation:none}.primary,.choice{transition:none}.primary:active,.choice:active{transform:none}}.error{color:#ffe5ef;background:#4b1328;border:1px solid #ff9fbb;padding:12px;border-radius:10px;font-size:18px;margin-top:16px}.error:empty{display:none}.privacy{font-size:16px;color:#ecd0dd;margin-top:22px}.reassure{font-size:16px;text-align:center;color:#f2dfe8;margin:28px 0 0;line-height:1.4}.success-icon{width:64px;height:64px;border-radius:50%;background:#f5487c;color:white;display:grid;place-items:center;font-size:34px;margin-bottom:20px}footer{text-align:center;color:#d4acbe;font-size:14px;padding:16px 20px}@media(max-width:600px){.hero{padding:28px 20px 26px}.hero h1 .title-intro{font-size:27px}.title-women,.title-mature{font-size:68px;letter-spacing:-2px}.hero-question{font-size:27px}.hero-description{font-size:18px}.hero-location{font-size:16px;padding:10px 13px;gap:10px}.hero-location svg{width:21px}.location-text{padding-left:10px}main{padding:0 18px}.card{padding:24px 20px}h2{font-size:37px}.hint{font-size:18px}.reassure{font-size:16px}}@media(max-width:350px){.hero{padding-left:16px;padding-right:16px}.title-women,.title-mature{font-size:60px}.hero-question{font-size:25px}.hero-location{font-size:15px}main{padding:0 14px}.card{padding:22px 17px}h2{font-size:33px}input{font-size:18px;padding-left:64px}.input-icon{left:14px;padding-right:10px}.primary{font-size:23px}.choice-yes{font-size:21px}}

<header class="hero"><div class="hero-inner"><h1><span class="title-intro">Seletiva para</span><span class="title-women">Mulheres</span><span class="title-mature">Maduras</span><svg class="title-swoosh" viewBox="0 0 320 20" aria-hidden="true"><path d="M0 19C80-3 244-7 320 15C216 5 103 8 0 19Z" fill="currentColor"/></svg></h1><div class="hero-copy"><p class="hero-question">Você tem <em>mais de 45 anos</em><br>e sonha em ser modelo?</p><p class="hero-description">Estamos procurando mulheres como você para uma <strong>seletiva presencial.</strong></p></div><p class="hero-location"><svg viewBox="0 0 24 30" aria-hidden="true"><path fill="currentColor" d="M12 1a11 11 0 0 0-11 11c0 8 11 17 11 17s11-9 11-17A11 11 0 0 0 12 1Zm0 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg><span class="location-text">Seletiva presencial em <strong>Piracicaba</strong></span></p></div></header>
<main><section class="card" aria-label="Formulário de inscrição"><div id="content"></div><p class="reassure">Pode voltar e corrigir suas respostas quando precisar.</p></section></main><footer>Seletiva presencial · Piracicaba</footer>
<script>
const META_PIXEL_ID = '1801282187897715';
const trackedSteps = new Set();
const completedSteps = new Set();
function trackCompletion(number){if(completedSteps.has(number))return;completedSteps.add(number);trackMeta('FormStepCompleted',{step:number});}
let formStarted = false;
function trackMeta(name,params={},eventId){
  if(!META_PIXEL_ID || typeof window.fbq !== 'function')return;
  try{window.fbq(name==='PageView'||name==='Lead'?'track':'trackCustom',name,{city:'Piracicaba',...params},eventId?{eventID:eventId}:undefined);}catch{}
}
function initMeta(){
  if(!META_PIXEL_ID)return;
  if(!window.fbq){const fbq=function(){fbq.callMethod?fbq.callMethod.apply(fbq,arguments):fbq.queue.push(arguments)};fbq.queue=[];fbq.loaded=true;fbq.version='2.0';fbq.push=fbq;window.fbq=fbq;window._fbq=fbq;
  const script=document.createElement('script');script.async=true;script.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(script);}
  window.fbq('set','autoConfig',false,META_PIXEL_ID);
  window.fbq('init',META_PIXEL_ID);
  trackMeta('PageView');

initMeta();
const normalizeAge = function normalizeAge(value) {
  const match = String(value ?? '').trim().match(/^(\d{1,3})(?:\s*anos?)?$/i);
  return match ? Number(match[1]) : NaN;
};
const values={name:'',age:'',phone:'',attendance:null};let step=0,busy=false,previousProgress=0;const content=document.getElementById('content');
const questions=['Qual é seu nome completo?','Qual é sua idade?','Qual é seu celular com DDD?','Você consegue comparecer à seletiva presencial em Piracicaba?'];
const hints=['Digite seu nome e sobrenome para iniciar <strong>sua inscrição.</strong>','Digite sua idade. Pode escrever 52 ou 52 anos.','Digite o DDD e o número do seu celular.','Toque na sua resposta para concluir a inscrição.'];
const questionMarkup=['Qual é seu<br><em>nome completo?</em>','Qual é sua<br><em>idade?</em>','Qual é seu<br><em>celular com DDD?</em>','Você consegue <em>comparecer</em> à seletiva presencial em Piracicaba?'];
const fieldIcons=['<circle cx="12" cy="8" r="4"/><path d="M4 25v-3a8 8 0 0 1 16 0v3"/>','<rect x="3" y="6" width="18" height="20" rx="3"/><path d="M7 2v8M17 2v8M3 13h18M8 18h2M14 18h2"/>','<rect x="5" y="2" width="14" height="25" rx="3"/><path d="M10 23h4"/>'];
function save(){const field=document.getElementById('answer');if(step<3&&field) values[['name','age','phone'][step]]=field.value;}
function showError(message){const el=document.getElementById('error');el.textContent=message;document.getElementById('answer')?.setAttribute('aria-invalid','true');}
function render(focus=false){if(!trackedSteps.has(step)){trackedSteps.add(step);trackMeta('FormStepViewed',{step:step+1});}content.innerHTML='<div class="progress-text"><span>Pergunta '+(step+1)+' de 4</span><span>'+Math.round((step+1)/4*100)+'%</span></div><div class="track" aria-hidden="true"><div class="fill" style="--previous-progress:'+previousProgress+'%;width:'+((step+1)*25)+'%"></div></div><form novalidate><h2 id="question" tabindex="-1">'+questionMarkup[step]+'</h2><p class="hint" id="hint">'+hints[step]+'</p><div id="fields"></div><p id="error" class="error" role="alert"></p><div class="actions">'+(step?'<button type="button" class="back">← Voltar</button>':'')+(step<3?'<button type="submit" class="primary">Continuar →</button>':'')+'</div>'+(step===3?'<p class="privacy">Ao tocar em uma resposta, você conclui sua inscrição e autoriza o uso do seu nome, idade e celular para organizar esta seletiva e entrar em contato sobre sua inscrição.</p>':'')+'</form>';
previousProgress=(step+1)*25;const fields=document.getElementById('fields');if(step<3){const input=document.createElement('input');input.id='answer';input.setAttribute('aria-labelledby','question');input.setAttribute('aria-describedby','hint error');input.required=true;input.type='text';input.inputMode=step===2?'tel':'text';input.autocomplete=step===0?'name':step===2?'tel-national':'off';input.maxLength=step===0?150:step===1?30:16;input.placeholder=['Seu nome completo','Sua idade','(19) 99999-9999'][step];input.value=values[['name','age','phone'][step]];const wrap=document.createElement('div');wrap.className='input-wrap';const icon=document.createElement('span');icon.className='input-icon';icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+fieldIcons[step]+'</svg>';wrap.append(icon,input);fields.append(wrap);input.addEventListener('input',()=>{if(!formStarted){formStarted=true;trackMeta('FormStarted');}if(step===2){let d=input.value.replace(/\D/g,'').slice(0,11);input.value=d.length>2?'('+d.slice(0,2)+') '+d.slice(2,7)+(d.length>7?'-'+d.slice(7):''):d;}save();});}else{fields.setAttribute('role','group');fields.setAttribute('aria-labelledby','question');for(const [value,text] of [[true,'Sim, consigo comparecer'],[false,'Não consigo comparecer']]){const button=document.createElement('button');button.type='button';button.className=value?'choice choice-yes':'choice choice-no';button.textContent=text;button.addEventListener('click',()=>{if(busy)return;values.attendance=value;submit({preventDefault(){}},button);});fields.append(button);}}
content.querySelector('.back')?.addEventListener('click',()=>{save();step--;render(true)});content.querySelector('form').addEventListener('submit',submit);if(focus)document.getElementById('question').focus();}
async function submit(event,selectedButton){event.preventDefault();if(busy)return;save();let error='';if(step===0&&(values.name.trim().split(/\s+/).length<2||!/^[\p{L}\p{M} '\-]+$/u.test(values.name.trim())))error='Digite seu nome completo, com nome e sobrenome.';if(step===1&&(!Number.isInteger(normalizeAge(values.age))||normalizeAge(values.age)<1||normalizeAge(values.age)>120))error='Digite sua idade. Pode escrever 52 ou 52 anos.';if(step===2&&!/^\d{2}9\d{8}$/.test(values.phone.replace(/\D/g,'')))error='Digite seu celular com DDD: 2 números do DDD e 9 do celular.';if(step===3&&values.attendance===null)error='Escolha Sim ou Não para continuar.';if(error){showError(error);return;}if(step<3){trackCompletion(step+1);step++;render(true);return;}busy=true;content.querySelectorAll('button,input').forEach(el=>el.disabled=true);const btn=selectedButton||content.querySelector('.choice-yes');const originalText=btn.textContent;btn.textContent='Enviando sua inscrição…';try{const response=await fetch('/api/inscricao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw Error(result.error||'Não foi possível concluir. Tente novamente.');trackCompletion(4);trackMeta('Lead',{},result.eventId);content.innerHTML='<div class="success-icon" aria-hidden="true">✓</div><h2 tabindex="-1">Inscrição concluída!</h2><p>Suas respostas foram recebidas.</p><p>Obrigada por se inscrever na seletiva em Piracicaba.</p><p class="hint">Você já pode fechar esta página.</p>';content.querySelector('h2').focus();document.querySelector('.reassure').hidden=true;Object.keys(values).forEach(key=>values[key]=null);}catch(e){showError(e instanceof TypeError?'Não conseguimos conectar. Confira sua internet e toque na resposta para tentar novamente. Suas respostas continuam aqui.':(e.message||'Confira sua conexão e tente novamente.'));content.querySelectorAll('button,input').forEach(el=>el.disabled=false);btn.textContent=originalText;}finally{busy=false;}}
render();
</script></body></html>
