<style>
*{box-sizing:border-box}html{height:100%;overflow:hidden}body{position:fixed;inset:0;margin:0;overflow:hidden;background:#190009;color:#fff6fa;font:18px/1.4 Arial,sans-serif}main{height:100vh;height:100svh;height:var(--app-height,100svh);padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;overflow:hidden}.quiz-shell{display:flex;flex-direction:column;width:100%;max-width:480px;min-height:0;height:100%;padding:22px;background:radial-gradient(ellipse at 50% 0%,#33091d,#1c020d 80%);border:1px solid #99566f;border-radius:24px}.quiz-header{text-align:center;flex:none;padding-bottom:18px}.quiz-header h1{font-size:21px;line-height:1.2;font-weight:400;margin:0}.quiz-header h1 strong{display:block;font:italic 700 44px/1.04 Georgia,'Times New Roman',serif;margin-top:3px;letter-spacing:-1px}.quiz-header h1 em{display:block;color:#ff729e;font-style:inherit}.quiz-header h1 strong span{display:block}.audience{display:inline-block;font-size:16px;line-height:1.45;color:#f7dfeb;margin:12px 0 0;padding:9px 15px;border:1px solid #8f3d5d;border-radius:18px;background:#ff609014}.audience strong{color:#ffa1c3;font-size:1.12em;font-weight:800;white-space:nowrap}#content{display:flex;flex-direction:column;flex:1;min-height:0}.progress-text{display:flex;justify-content:space-between;font-size:14px;gap:8px;color:#eed9e3;flex:none}.track{height:5px;min-height:5px;background:#613045;border-radius:8px;margin:8px 0 22px;overflow:hidden}.fill{height:100%;background:#ff6090;border-radius:8px}form{display:flex;flex-direction:column;justify-content:space-evenly;gap:16px;flex:1;min-height:0;animation:question-in 160ms ease-out}h2{font:700 35px/1.06 Georgia,'Times New Roman',serif;letter-spacing:-.7px;margin:0 0 12px;flex:none}h2 em{font-style:italic;color:#ff83ab}.hint{font-size:17px;line-height:1.35;margin:0 0 18px;color:#f6e5ed;flex:none}#fields{flex:none}.input-wrap{position:relative}.input-icon{position:absolute;top:50%;left:15px;transform:translateY(-50%);padding-right:11px;border-right:1px solid #a64b6a;display:flex;align-items:center;pointer-events:none;color:#edc7d7}.input-icon svg{width:22px;height:26px}input{width:100%;min-width:0;min-height:58px;border:1.5px solid #b87b91;border-radius:12px;color:#fff9fb;background:#ffffff03;font:20px Arial,sans-serif;padding:15px 12px 15px 64px}input::placeholder{color:#e6ccd7;opacity:1}input:focus,button:focus-visible{outline:3px solid #ff8eb2;outline-offset:3px}input[aria-invalid=true]{border-color:#ff9fbb}button{font:700 21px/1.25 Arial,sans-serif;cursor:pointer;touch-action:manipulation;padding:12px 15px;min-height:56px;white-space:normal;overflow-wrap:break-word}button:disabled{opacity:.7;cursor:wait}.actions{display:flex;flex-direction:column;gap:7px;flex:none;margin-top:0;padding-top:0}.primary{background:#ef3e75;color:white;border:1px solid #ef3e75;border-radius:32px;width:100%;order:-1}.primary:hover,.choice-yes:hover{background:#d82d63}.back{align-self:center;min-height:40px;font-size:16px;background:transparent;border:0;color:#f1d3e0;padding:8px 20px}.choice{width:100%;display:block;border:1.5px solid #b87b91;border-radius:16px;margin:0 0 10px;background:transparent;color:#fff9fb;font-size:18px;min-height:56px}.choice-yes{background:#ef3e75;color:white;border-color:#ef3e75;font-size:20px;min-height:62px}.privacy{font-size:13px;line-height:1.3;color:#e9c9d9;margin:9px 0 0;flex:none}.reassure{flex:none;text-align:center;font-size:13px;line-height:1.35;color:#e6c6d6;margin:12px 0 0}.error{font-size:15px;line-height:1.25;color:#ffe7ef;background:#4c172c;border:1px solid #ff9fbb;border-radius:9px;padding:8px;margin:10px 0 0;flex:none}.error:empty{display:none}.success-icon{color:#ff83ab;font-size:42px;margin:15px 0}.quiz-shell[data-step="3"] h2{font-size:28px;line-height:1.15}.quiz-shell[data-step="3"] .hint{margin-bottom:14px}.quiz-shell[data-step="3"] .quiz-header{display:none}.quiz-shell[data-step="3"] .reassure{display:none}.quiz-shell[data-step="3"] .actions{padding-top:0;margin-top:0}.quiz-shell:not([data-step="0"]) .quiz-header{display:none}.has-error .reassure{display:none}.keyboard-open .quiz-header,.keyboard-open .reassure,.keyboard-open .hint,.keyboard-open .progress-text,.keyboard-open .track{display:none}.keyboard-open .quiz-shell{padding:14px}.keyboard-open h2{font-size:27px;margin-bottom:10px}.keyboard-open .actions{padding-top:10px;gap:3px}.keyboard-open input{min-height:48px;padding-top:11px;padding-bottom:11px}.keyboard-open .primary{min-height:48px;font-size:20px;padding:9px 12px}.keyboard-open .back{min-height:32px;padding:4px 15px}.keyboard-open .error{font-size:14px;margin-top:6px;padding:6px}.primary:active,.choice:active{background:#d82d63}@keyframes question-in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){form{animation:none}}@media(max-height:620px){main{padding:8px}.quiz-shell{padding:18px}.quiz-header{padding-bottom:12px}.quiz-header h1{font-size:18px}.quiz-header h1 strong{font-size:36px}.audience{margin-top:9px;padding:7px 12px;font-size:14px}.track{margin-bottom:16px}h2{font-size:32px}.hint{margin-bottom:14px;font-size:16px}.reassure{margin-top:8px}.actions{padding-top:13px}.quiz-shell[data-step="3"] h2{font-size:26px}}@media(max-width:350px){.quiz-shell{padding:17px}.quiz-header h1 strong{font-size:35px}.audience{font-size:14px}h2{font-size:31px}input{font-size:18px}.quiz-shell[data-step="3"] h2{font-size:25px}}
.question-block{flex:none}.question-block .hint{margin-bottom:0}.choice:last-child{margin-bottom:0}.has-error .hint{display:none}.keyboard-open form{justify-content:space-between;gap:6px}.keyboard-open .actions{padding-top:0}.reassure{padding-bottom:18px}@media(max-height:620px){form{gap:8px}.actions{padding-top:0}.reassure{padding-bottom:10px}}

<main><section class="quiz-shell" data-step="0" aria-label="Inscrição na seletiva"><header class="quiz-header"><h1>Seletiva para<strong><em>Mulheres</em><span>Maduras</span></strong></h1><p class="audience">Para mulheres com mais de <strong>45 anos</strong></p></header><div id="content"></div><p class="reassure">Uma pergunta por vez. Você pode voltar e corrigir.</p></section></main>
<script>
const META_PIXEL_ID = '1801282187897715';
const trackedSteps = new Set();
const completedSteps = new Set();
function trackCompletion(number){if(completedSteps.has(number))return;completedSteps.add(number);trackMeta('FormStepCompleted',{step:number});}
let formStarted = false;
function trackMeta(name,params={},eventId){
  if(!META_PIXEL_ID || typeof window.fbq !== 'function')return;
  try{window.fbq(name==='PageView'||name==='Lead'?'track':'trackCustom',name,{city:'Piracicaba',...params},eventId?{eventID:eventId}:undefined);}catch{}
}
function initMeta(){
  if(!META_PIXEL_ID)return;
  if(!window.fbq){const fbq=function(){fbq.callMethod?fbq.callMethod.apply(fbq,arguments):fbq.queue.push(arguments)};fbq.queue=[];fbq.loaded=true;fbq.version='2.0';fbq.push=fbq;window.fbq=fbq;window._fbq=fbq;
  const script=document.createElement('script');script.async=true;script.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(script);}
  window.fbq('set','autoConfig',false,META_PIXEL_ID);
  window.fbq('init',META_PIXEL_ID);
  trackMeta('PageView');
}
initMeta();
const normalizeAge = function normalizeAge(value) {
  const match = String(value ?? '').trim().match(/^(\d{1,3})(?:\s*anos?)?$/i);
  return match ? Number(match[1]) : NaN;
};
function newRegistrationId(){if(window.crypto?.randomUUID)return window.crypto.randomUUID();const bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}
const registrationId=newRegistrationId();
const values={name:'',age:'',phone:'',attendance:null};let step=0,busy=false;const content=document.getElementById('content');
const questions=['Qual é seu nome completo?','Qual é sua idade?','Qual é seu celular com DDD?','Você consegue comparecer à seletiva presencial em Piracicaba?'];
const hints=['Digite seu nome e sobrenome.','Digite sua idade. Pode escrever 52 ou 52 anos.','Digite o DDD e o número do seu celular.','Toque na sua resposta para concluir a inscrição.'];
const questionMarkup=['Qual é seu<br><em>nome completo?</em>','Qual é sua<br><em>idade?</em>','Qual é seu<br><em>celular com DDD?</em>','Você consegue <em>ir à seletiva</em> em Piracicaba?'];
const fieldIcons=['<circle cx="12" cy="8" r="4"/><path d="M4 25v-3a8 8 0 0 1 16 0v3"/>','<rect x="3" y="6" width="18" height="20" rx="3"/><path d="M7 2v8M17 2v8M3 13h18M8 18h2M14 18h2"/>','<rect x="5" y="2" width="14" height="25" rx="3"/><path d="M10 23h4"/>'];
function save(){const field=document.getElementById('answer');if(step<3&&field) values[['name','age','phone'][step]]=field.value;}
function showError(message){document.body.classList.add('has-error');const el=document.getElementById('error');el.textContent=message;document.getElementById('answer')?.setAttribute('aria-invalid','true');}
function render(focus=false){document.body.classList.remove('has-error');document.querySelector('.quiz-shell').dataset.step=String(step);if(!trackedSteps.has(step)){trackedSteps.add(step);trackMeta('FormStepViewed',{step:step+1});}content.innerHTML='<form novalidate><div class="question-block"><h2 id="question" tabindex="-1">'+questionMarkup[step]+'</h2><p class="hint" id="hint">'+hints[step]+'</p></div><div id="fields"></div><p id="error" class="error" role="alert"></p><div class="actions">'+(step?'<button type="button" class="back">← Voltar</button>':'')+(step<3?'<button type="submit" class="primary">Continuar →</button>':'')+'</div>'+(step===3?'<p class="privacy">Ao responder, você conclui a inscrição e autoriza o uso dos seus dados para organizar a seletiva e entrar em contato.</p>':'')+'</form>';
const fields=document.getElementById('fields');if(step<3){const input=document.createElement('input');input.id='answer';input.setAttribute('aria-labelledby','question');input.setAttribute('aria-describedby','hint error');input.required=true;input.type='text';input.inputMode=step===2?'tel':'text';input.autocomplete=step===0?'name':step===2?'tel-national':'off';input.maxLength=step===0?150:step===1?30:16;input.placeholder=['Seu nome completo','Sua idade','(19) 99999-9999'][step];input.value=values[['name','age','phone'][step]];const wrap=document.createElement('div');wrap.className='input-wrap';const icon=document.createElement('span');icon.className='input-icon';icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+fieldIcons[step]+'</svg>';wrap.append(icon,input);fields.append(wrap);input.addEventListener('input',()=>{if(!formStarted){formStarted=true;trackMeta('FormStarted');}if(step===2){let d=input.value.replace(/\D/g,'').slice(0,11);input.value=d.length>2?'('+d.slice(0,2)+') '+d.slice(2,7)+(d.length>7?'-'+d.slice(7):''):d;}save();});}else{fields.setAttribute('role','group');fields.setAttribute('aria-labelledby','question');for(const [value,text] of [[true,'Sim, consigo comparecer'],[false,'Não consigo comparecer']]){const button=document.createElement('button');button.type='button';button.className=value?'choice choice-yes':'choice choice-no';button.textContent=text;button.addEventListener('click',()=>{if(busy)return;values.attendance=value;submit({preventDefault(){}},button);});fields.append(button);}}
content.querySelector('.back')?.addEventListener('click',()=>{save();step--;render(true)});content.querySelector('form').addEventListener('submit',submit);if(focus)document.getElementById('question').focus({preventScroll:true});}
async function submit(event,selectedButton){event.preventDefault();if(busy)return;save();let error='';if(step===0&&(values.name.trim().split(/\s+/).length<2||!/^[\p{L}\p{M} '\-]+$/u.test(values.name.trim())))error='Digite seu nome completo, com nome e sobrenome.';if(step===1&&(!Number.isInteger(normalizeAge(values.age))||normalizeAge(values.age)<1||normalizeAge(values.age)>120))error='Digite sua idade. Pode escrever 52 ou 52 anos.';if(step===2&&!/^\d{2}9\d{8}$/.test(values.phone.replace(/\D/g,'')))error='Digite seu celular com DDD: 2 números do DDD e 9 do celular.';if(step===3&&values.attendance===null)error='Escolha Sim ou Não para continuar.';if(error){showError(error);return;}if(step<3){trackCompletion(step+1);step++;render(true);return;}busy=true;content.querySelectorAll('button,input').forEach(el=>el.disabled=true);const btn=selectedButton||content.querySelector('.choice-yes');const originalText=btn.textContent;btn.textContent='Enviando sua inscrição…';try{const response=await fetch('/api/inscricao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...values,registrationId})});const result=await response.json();if(!response.ok)throw Error(result.error||'Não foi possível concluir. Tente novamente.');trackCompletion(4);trackMeta('Lead',{},result.eventId);content.innerHTML='<div class="success-icon" aria-hidden="true">✓</div><h2 tabindex="-1">Inscrição concluída!</h2><p>Suas respostas foram recebidas.</p><p>Obrigada por se inscrever na seletiva em Piracicaba.</p><p class="hint">Você já pode fechar esta página.</p>';content.querySelector('h2').focus();document.querySelector('.reassure').hidden=true;Object.keys(values).forEach(key=>values[key]=null);}catch(e){showError(e instanceof TypeError?'Não conseguimos conectar. Confira sua internet e toque na resposta para tentar novamente. Suas respostas continuam aqui.':(e.message||'Confira sua conexão e tente novamente.'));content.querySelectorAll('button,input').forEach(el=>el.disabled=false);btn.textContent=originalText;}finally{busy=false;}}
const initialViewportHeight=window.innerHeight;
function fitViewport(){const height=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--app-height',height+'px');document.body.classList.toggle('keyboard-open',document.activeElement?.tagName==='INPUT'&&height<initialViewportHeight-100);}
window.visualViewport?.addEventListener('resize',fitViewport);window.addEventListener('resize',fitViewport);document.addEventListener('focusin',fitViewport);document.addEventListener('focusout',()=>setTimeout(fitViewport,0));
fitViewport();render();
</script></body></html>
